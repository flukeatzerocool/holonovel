name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - name: Shell script lint (entry points)
        run: shellcheck -S warning scripts/push-pipeline.sh .githooks/pre-commit .githooks/pre-push .githooks/commit-msg
      - run: npm ci
      - name: Install server dependencies
        working-directory: holonovel
        run: npm ci
      - name: Assemble spec
        run: npm run assemble
      - name: Full gate (lint + validate + readme + traceability)
        run: npm run check
      - name: Version consistency + currency (REQ-107a)
        run: npx tsx scripts/version-check.ts
      - name: Pending-update gate smoke (REQ-394 / T462)
        run: npx tsx scripts/spec-delta.ts --server holonovel --report-only
      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit server production dependencies
        working-directory: holonovel
        run: npm audit --omit=dev --audit-level=high
      - name: Packed-artifact smoke (REQ-614)
        run: npm run test:package-smoke

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the container image (REQ-428)
        run: docker build -t holonovel:ci holonovel
      - name: Start the host from the image
        run: docker run --rm holonovel:ci help
