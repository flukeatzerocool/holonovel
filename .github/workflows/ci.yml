name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Assemble spec
        run: npm run assemble
      - name: Full gate (lint + validate + readme + traceability)
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Version consistency + currency (REQ-107a)
        run: npx tsx scripts/version-check.ts
      - name: Pending-update gate smoke (REQ-394 / T462)
        run: npx tsx scripts/spec-delta.ts --server holonovel --report-only
      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit server production dependencies
        working-directory: holonovel
        run: npm audit --omit=dev --audit-level=high
      - name: Install server dependencies
        working-directory: holonovel
        run: npm ci
      - name: Server tool-definition + security harnesses (REQ-427/REQ-429/REQ-450)
        working-directory: holonovel
        run: npm run test:tool-definitions && npm run test:security
      - name: Holosuite deterministic tiers (conformance + invariants)
        working-directory: holonovel
        run: npm run test:holosuite-conformance && npm run test:holosuite-invariants
