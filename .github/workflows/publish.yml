name: Publish Server

on:
  push:
    branches: [main]
    paths:
      - "holonovel/package.json"
      - "holonovel/src/**"
      - "holonovel/bin/**"
      - "holonovel/tsconfig*.json"
      - "holonovel/server.json"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install server dependencies
        working-directory: holonovel
        run: npm ci
      - name: Determine if version is already published
        id: check
        working-directory: holonovel
        run: |
          LOCAL_VERSION=$(node -e "console.log(require('./package.json').version)")
          PUBLISHED_VERSION=$(npm view holonovel version 2>/dev/null || echo "")
          echo "local=$LOCAL_VERSION"
          echo "published=$PUBLISHED_VERSION"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Already published — skipping."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        working-directory: holonovel
        run: npm run build
      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        working-directory: holonovel
        run: npm publish --provenance --access public
      - name: Sync server.json version with package.json
        if: steps.check.outputs.should_publish == 'true'
        run: |
          CANONICAL=$(node -e "console.log(require('./holonovel/package.json').version.split('.').map((p,i)=>i===0?p:String(parseInt(p,10))).join('.'))")
          node -e "
            const fs = require('fs');
            const p = 'holonovel/server.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = process.argv[1];
            j.packages[0].version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          " "$CANONICAL"
      - name: Validate server.json
        if: steps.check.outputs.should_publish == 'true'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher validate holonovel/server.json
      - name: Publish to MCP Registry
        if: steps.check.outputs.should_publish == 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish holonovel/server.json
